<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không Tìm Thấy Trang</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff; 
            overflow: hidden; 
        }

        .error-container {
            width: 100%;
            max-width: 1200px; 
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .error-image {
            max-width: 100%;
            height: auto;
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <img 
            src="image/404.jpg" 
            alt="Trang không tồn tại" 
            class="error-image"
        >
    </div>

</body>
</html>
